<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ — Tasty Temptations</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }
    .story {
      width: 100%;
      max-width: 430px;
      aspect-ratio: 9/16;
      background: #88e884;
      border: 4px solid #222;
      border-radius: 24px;
      box-shadow: 12px 12px 0 #000;
      position: relative;
      overflow: hidden;
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .grid {
      position: absolute;
      right: -30px;
      top: 20px;
      width: 180px;
      height: 180px;
      opacity: 0.25;
      background-image: linear-gradient(#222 1px, transparent 1px), linear-gradient(90deg, #222 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .logo-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      align-self: center;
      margin-bottom: 24px;
      filter: drop-shadow(5px 5px 0 #222);
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      text-align: center;
      line-height: 0.95;
      color: #222;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 3px 3px 0 #fff;
    }
    .browser {
      background: #8b5dfe;
      border: 3px solid #222;
      border-radius: 14px;
      box-shadow: 6px 6px 0 #222;
      padding: 12px;
      margin: 0 auto 28px;
      width: 100%;
    }
    .dots { display: flex; gap: 8px; margin-bottom: 10px; }
    .dot { width: 12px; height: 12px; border: 2px solid #222; border-radius: 50%; }
    .r { background: #ff6b6b; }
    .y { background: #fff3a3; }
    .g { background: #6be68d; }
    .screen {
      height: 120px;
      background: #fff8d5;
      border: 3px solid #222;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #222;
    }
    .card {
      background: #fff;
      border: 3px solid #222;
      border-radius: 14px;
      box-shadow: 6px 6px 0 #222;
      padding: 20px;
      text-align: center;
    }
    .card p {
      font-size: 1rem;
      font-weight: 700;
      color: #222;
      line-height: 1.4;
    }
    .flower, .star {
      position: absolute;
      border: 3px solid #222;
      box-shadow: 5px 5px 0 #222;
    }
    .flower {
      left: 24px;
      bottom: 120px;
      width: 70px;
      height: 70px;
      background: #ff7b54;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .star {
      right: 24px;
      top: 160px;
      width: 60px;
      height: 60px;
      background: #fff3a3;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }
    .badge {
      position: absolute;
      left: 24px;
      bottom: 40px;
      background: #8b5dfe;
      border: 3px solid #222;
      border-radius: 10px;
      padding: 10px 18px;
      box-shadow: 5px 5px 0 #222;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: #fff;
      font-size: 1rem;
    }
    .page {
      position: absolute;
      right: 24px;
      bottom: 40px;
      background: #fff;
      border: 3px solid #222;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 0 #222;
      font-weight: 900;
      font-size: 0.9rem;
    }
    a.nav {
      position: absolute;
      inset: 0;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="story">
    <a class="nav" href="story-2.html"></a>
    <div class="grid"></div>
    <div class="star">★</div>
    <div class="flower">✿</div>

    <img class="logo-img" src="/illustrations/logos/logo-option-1.png" alt="Tasty Temptations logo">

    <div class="browser">
      <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
      <div class="screen">TASTY TEMPTATIONS</div>
    </div>

    <h1>Preguntas<br>Frecuentes</h1>

    <div class="card">
      <p>Desliza para conocer todo sobre delivery, pagos, alérgenos y más. ✨</p>
    </div>

    <div class="badge">YUMMY!</div>
    <div class="page">1/5</div>
  </div>
</body>
</html>
